[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-evidence"
version = "0.5.1"
description = "Local-first document evidence indexing and extraction pipeline"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
authors = [
  { name = "Kyle Graehl" },
]
dependencies = [
  "fastapi>=0.116,<1",
  "jsonschema>=4.23,<5",
  "pydantic>=2.12,<3",
  "PyYAML>=6,<7",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
]

[project.scripts]
doc-evidence = "doc_evidence.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
doc_evidence = ["schema_files/*.json"]
