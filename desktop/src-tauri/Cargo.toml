[package]
name = "doc-evidence-desktop"
version = "0.4.0"
description = "Thin native supervisor for the Doc Evidence local engine"
authors = ["Doc Evidence contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "doc_evidence_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
getrandom = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-single-instance = "2.4.3"
